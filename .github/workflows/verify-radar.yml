name: Verify recovered Radar
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'tests/**', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json', '.github/workflows/verify-radar.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-recovery-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_CONVEX_URL: https://ceaseless-chameleon-385.eu-west-1.convex.cloud
      VITE_MIGRATION_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover only checksum-pinned public assets and apply narrow adapters
        run: |
          node scripts/recover-public-assets.mjs
          node scripts/apply-moje-filter.mjs
          node scripts/apply-migration-access.mjs
      - name: Install build tools
        timeout-minutes: 3
        run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Build original frontend
        run: npm run build
      - name: Typecheck generated routes and client code
        run: npm run typecheck
      - name: Persist compiled source and checksum-verified assets
        run: |
          git config user.name 'Radar migration checks'
          git config user.email 'radar-migration@users.noreply.github.com'
          git add public src/components/personal-radar.tsx src/components/auth-dialog.tsx src/routeTree.gen.ts migration/PUBLIC_ASSETS.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: checkpoint build-tested source, media filter and pinned assets'
            git push origin HEAD:main
          fi
          git archive --format=zip --output=Radar-source.zip HEAD
      - name: Store compiled build and source archive
        uses: actions/upload-artifact@v4
        with:
          name: radar-compiled-build
          path: |
            dist/
            .output/public/
            Radar-source.zip
          include-hidden-files: true
          retention-days: 14
      - name: Install browser testing tools
        timeout-minutes: 3
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Anonymous browser verification
        timeout-minutes: 5
        run: |
          if [ -f .output/server/index.mjs ]; then
            NITRO_PORT=4173 node .output/server/index.mjs > /tmp/radar-server.log 2>&1 &
          else
            npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/radar-server.log 2>&1 &
          fi
          ready=false
          for n in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=true; break; fi; sleep 1; done
          if [ "$ready" != true ]; then cat /tmp/radar-server.log; exit 1; fi
          node scripts/smoke-ui.mjs
      - name: Capture server log
        if: always()
        run: |
          mkdir -p qa-artifacts
          test ! -f /tmp/radar-server.log || cp /tmp/radar-server.log qa-artifacts/server.log
      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-browser-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
